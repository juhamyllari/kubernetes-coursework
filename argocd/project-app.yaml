# Argo CD Application for the project (todo app). Applied once by hand
# (kubectl apply -f); after that Argo CD tracks the_project/ on main.
# The secrets postgres-secret and broadcaster-secret and the ConfigMap
# backup-config must exist in the namespace beforehand (not in git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juhamyllari/kubernetes-coursework.git
    targetRevision: main
    path: the_project
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
