# Argo CD Application for the project, production environment. Applied once by hand
# (kubectl apply -f). Only tagged releases (v*) are deployed, via the production branch that CI updates on a tag.
# Secrets and ConfigMaps listed in the_project/overlays/production/kustomization.yaml
# must exist in the namespace beforehand (not in git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juhamyllari/kubernetes-coursework.git
    targetRevision: production
    path: the_project/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
