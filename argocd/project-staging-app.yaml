# Argo CD Application for the project, staging environment. Applied once by hand
# (kubectl apply -f). Every commit to main is deployed.
# Secrets and ConfigMaps listed in the_project/overlays/staging/kustomization.yaml
# must exist in the namespace beforehand (not in git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juhamyllari/kubernetes-coursework.git
    targetRevision: main
    path: the_project/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
