# Argo CD Application for the project, staging environment. Applied once by hand
# (kubectl apply -f). Tracks the separate config repo (kubernetes-coursework-config); CI there
# updates overlays/staging on every push to main of the source repo.
# Secrets and ConfigMaps listed in overlays/staging/kustomization.yaml of the config repo
# must exist in the namespace beforehand (not in git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juhamyllari/kubernetes-coursework-config.git
    targetRevision: main
    path: overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
