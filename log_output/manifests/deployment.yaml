apiVersion: apps/v1
kind: Deployment
metadata:
  name: stamppong-deployment
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stamppong
  template:
    metadata:
      labels:
        app: stamppong
    spec:
      containers:
      - name: stamppong
        image: stamppong
        env:
          - name: COUNTER_SERVICE_URL
            value: "http://pingpong-svc:80/pings"
          - name: MESSAGE
            valueFrom:
              configMapKeyRef:
                name: log-configmap
                key: MESSAGE
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
          - name: config-volume
            mountPath: /etc/config
      volumes:
        - name: config-volume
          configMap:
            name: log-configmap
