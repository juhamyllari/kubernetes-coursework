name: Release application

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'the_project/**'
      - '.github/workflows/project.yaml'

permissions:
  contents: read
  id-token: write

env:
    PROJECT_ID: ${{ secrets.GKE_PROJECT }}
    REGISTRY: europe-north1-docker.pkg.dev
    REGISTRY_LOCATION: europe-north1
    REPOSITORY: dwk-repo
    BRANCH: ${{ github.ref_name }}
    APP_DIR: "the_project"
    CONFIG_REPO: juhamyllari/kubernetes-coursework-config
    # Commits are tagged with the sha, releases with the git tag (e.g. v1.2.0).
    IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  
jobs:
  build-publish-deploy:
    name: Build, Publish and Update Manifests
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 'Authenticate with Google Cloud'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GKE_PROJECT }}
          version: latest
      
      - name: 'Use gcloud CLI'
        run: gcloud info

      - name: 'Configure Docker'
        run: gcloud --quiet auth configure-docker $REGISTRY

        # e.g. europe-north1-docker.pkg.dev/my-project/my-repo
      - name: Compute image base path
        run: echo "IMAGE_BASE=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}" >> "$GITHUB_ENV"
            
      - name: Build and push backend
        run: |
          docker build --tag "$IMAGE_BASE/backend:$IMAGE_TAG" "$APP_DIR/todo_backend"
          docker push "$IMAGE_BASE/backend:$IMAGE_TAG"
 
      - name: Build and push frontend
        run: |
          docker build --tag "$IMAGE_BASE/frontend:$IMAGE_TAG" "$APP_DIR/todo_app"
          docker push "$IMAGE_BASE/frontend:$IMAGE_TAG"

      - name: Build and push broadcaster
        run: |
          docker build --tag "$IMAGE_BASE/broadcaster:$IMAGE_TAG" "$APP_DIR/broadcaster"
          docker push "$IMAGE_BASE/broadcaster:$IMAGE_TAG"

      # GitOps: CI only records the new image tags in the separate config repo
      # (juhamyllari/kubernetes-coursework-config); Argo CD deploys them from there.
      #   main        -> overlays/staging
      #   v* tag      -> overlays/production
      # Both are plain commits to the config repo's main. The push uses a write-enabled
      # deploy key of that repo (secret CONFIG_REPO_DEPLOY_KEY), because GITHUB_TOKEN
      # only covers this repository.
      - name: Check out config repo
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONFIG_REPO }}
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          ref: main
          path: config

      - name: Set up Kustomize
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: imranismail/setup-kustomize@v3

      - name: Commit new image tags to the config repo
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        working-directory: config/overlays/${{ github.ref_type == 'tag' && 'production' || 'staging' }}
        env:
          TARGET: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
        run: |-
          kustomize edit set image todo-backend="$IMAGE_BASE/backend:$IMAGE_TAG"
          kustomize edit set image todo-frontend="$IMAGE_BASE/frontend:$IMAGE_TAG"
          kustomize edit set image broadcaster="$IMAGE_BASE/broadcaster:$IMAGE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Deploy $TARGET $IMAGE_TAG (source commit $GITHUB_SHA)"
          git pull --rebase origin main
          git push origin HEAD:main
