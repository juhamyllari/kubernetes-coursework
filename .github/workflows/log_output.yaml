name: Release log output apps

on:
  push:
    branches:
      - '**'
    paths:
      - 'log_output/**'
      - '.github/workflows/log_output.yaml'

permissions:
  contents: write
  id-token: write

env:
    PROJECT_ID: ${{ secrets.GKE_PROJECT }}
    REGISTRY: europe-north1-docker.pkg.dev
    REGISTRY_LOCATION: europe-north1
    REPOSITORY: dwk-repo
    BRANCH: ${{ github.ref_name }}
    APP_DIR: "log_output"
    IMAGE_TAG: ${{ github.sha }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Update Manifests
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 'Authenticate with Google Cloud'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GKE_PROJECT }}
          version: latest

      - name: 'Configure Docker'
        run: gcloud --quiet auth configure-docker $REGISTRY

        # e.g. europe-north1-docker.pkg.dev/my-project/my-repo
      - name: Compute image base path
        run: echo "IMAGE_BASE=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}" >> "$GITHUB_ENV"

      - name: Build and push stamppong
        run: |
          docker build --tag "$IMAGE_BASE/stamppong:$IMAGE_TAG" "$APP_DIR/stamppong_app"
          docker push "$IMAGE_BASE/stamppong:$IMAGE_TAG"

      - name: Build and push pingpong
        run: |
          docker build --tag "$IMAGE_BASE/pingpong:$IMAGE_TAG" "$APP_DIR/pingpong_app"
          docker push "$IMAGE_BASE/pingpong:$IMAGE_TAG"

      # GitOps: CI only records the new image tags in git. Argo CD watches
      # log_output/ on main and deploys the change to the cluster.
      - name: Set up Kustomize
        if: github.ref == 'refs/heads/main'
        uses: imranismail/setup-kustomize@v3

      - name: Commit new image tags
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ env.APP_DIR }}
        run: |-
          kustomize edit set image stamppong="$IMAGE_BASE/stamppong:$IMAGE_TAG"
          kustomize edit set image pingpong="$IMAGE_BASE/pingpong:$IMAGE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Deploy log output $IMAGE_TAG [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
