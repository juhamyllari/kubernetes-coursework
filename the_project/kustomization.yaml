apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project
resources:
  - manifests/namespace.yaml
  - manifests/app-config.yaml
  - manifests/deployment.yaml
  - manifests/ingress.yaml
  - manifests/persistentvolumeclaim.yaml
  - manifests/postgres-config.yaml
  - manifests/postgres-statefulset.yaml
  - manifests/service.yaml
  - manifests/hpa.yaml
  - manifests/cronjob.yaml
  - manifests/backup-serviceaccount.yaml
  - manifests/backup-cronjob.yaml

# Marks the Namespace as created by the branch pipeline; the cleanup workflow
# only deletes namespaces carrying this label.
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          deployed-by: branch-pipeline

# The Postgres password is never committed. postgres-secret.env (gitignored)
# must contain a line POSTGRES_PASSWORD=...; CI writes it from a GitHub secret.
# The generated Secret name gets a content hash, so changing the password
# rolls the pods that reference it.
secretGenerator:
  - name: postgres-secret
    envs:
      - postgres-secret.env

# The backup bucket name is not committed either. backup-config.env (gitignored)
# must contain a line BACKUP_BUCKET=<bucket name, without gs://>; CI writes it
# from a GitHub secret.
configMapGenerator:
  - name: backup-config
    envs:
      - backup-config.env

# Image overrides. `name` is a placeholder that must match the image name used
# in the manifests; the manifests carry no registry or version. newName/newTag
# here are the local-build fallback (Docker Hub); CI rewrites them with
# `kustomize edit set image`.
images:
  - name: todo-frontend
    newName: juhamyllari/todo-app
    newTag: v2.10.0
  - name: todo-backend
    newName: juhamyllari/todo-backend
    newTag: v3.5.2
