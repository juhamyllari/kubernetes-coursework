apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project
resources:
  - manifests/namespace.yaml
  - manifests/app-config.yaml
  - manifests/deployment.yaml
  - manifests/gateway.yaml
  - manifests/route.yaml
  - manifests/persistentvolumeclaim.yaml
  - manifests/postgres-config.yaml
  - manifests/postgres-statefulset.yaml
  - manifests/nats.yaml
  - manifests/broadcaster.yaml
  - manifests/webhook-sink.yaml
  - manifests/service.yaml
  - manifests/hpa.yaml
  - manifests/cronjob.yaml
  - manifests/backup-serviceaccount.yaml
  - manifests/backup-cronjob.yaml

# Secrets and config are not in git. Argo CD deploys this directory straight from
# main, so these are created by hand in the "project" namespace (see
# scripts/create-cluster.sh and the_project/README.md) and Argo CD does not manage them:
#   postgres-secret     POSTGRES_PASSWORD
#   broadcaster-secret  WEBHOOK_URL, WEBHOOK_FORMAT (generic|discord)
#   backup-config       BACKUP_BUCKET (bucket name, without gs://)

# Image overrides. `name` is a placeholder that must match the image name used
# in the manifests; the manifests carry no registry or version. newName/newTag
# here are the initial values (Docker Hub); the CI workflow rewrites them with
# `kustomize edit set image` and commits the result to main; Argo CD then deploys it.
images:
  - name: todo-frontend
    newName: juhamyllari/todo-app
    newTag: v2.10.0
  - name: todo-backend
    newName: juhamyllari/todo-backend
    newTag: v3.5.2
  - name: broadcaster
    newName: juhamyllari/broadcaster
    newTag: v1.0.0
