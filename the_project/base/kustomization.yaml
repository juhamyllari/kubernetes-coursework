# Manifests shared by every environment. The overlays add the namespace,
# image versions and the environment-specific differences.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- app-config.yaml
- deployment.yaml
- gateway.yaml
- route.yaml
- persistentvolumeclaim.yaml
- postgres-config.yaml
- postgres-statefulset.yaml
- nats.yaml
- broadcaster.yaml
- webhook-sink.yaml
- service.yaml
- hpa.yaml
- cronjob.yaml
