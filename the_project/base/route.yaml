apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-route
spec:
  parentRefs:
  - name: todo-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: todo-svc
      port: 80

  # No URL rewrite: like the Ingress before it, the backend receives /api/... as is.
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: todo-backend-svc
      port: 80
