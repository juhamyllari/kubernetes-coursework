# Stand-in for an external chat service: logs every request it receives
# (including the JSON body) to stdout.
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink-svc
spec:
  selector:
    app: webhook-sink
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-sink
  template:
    metadata:
      labels:
        app: webhook-sink
    spec:
      containers:
      - name: webhook-sink
        image: mendhak/http-https-echo:39
        env:
          - name: HTTPS_PORT
            value: "0"
          - name: LOG_IGNORE_PATH
            value: /healthz
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
