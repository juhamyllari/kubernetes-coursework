apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: db-backup
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir: {}
          # Step 1: dump the database to the shared volume. pg_dump reads the
          # standard PG* environment variables. Use the same major version as
          # the server (postgres:16-alpine in postgres-statefulset.yaml).
          initContainers:
            - name: pg-dump
              image: postgres:16-alpine
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_HOST
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_PORT
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_USER
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  pg_dump -Fc -f /backup/dump.pgdump
                  ls -l /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          # Step 2: upload the dump to Cloud Storage. Credentials come from
          # Workload Identity via the pod's ServiceAccount.
          containers:
            - name: upload
              image: google/cloud-sdk:slim
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: backup-config
                      key: BACKUP_BUCKET
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  DEST="gs://${BACKUP_BUCKET}/${NAMESPACE}/tododb-$(date -u +%Y-%m-%dT%H%M%SZ).pgdump"
                  gcloud storage cp /backup/dump.pgdump "$DEST"
                  echo "Uploaded $DEST"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
