apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
      - name: broadcaster
        image: broadcaster
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        env:
          - name: NATS_URL
            value: nats://nats-svc:4222
        # WEBHOOK_URL and WEBHOOK_FORMAT come from the generated secret
        # (see kustomization.yaml).
        envFrom:
          - secretRef:
              name: broadcaster-secret
