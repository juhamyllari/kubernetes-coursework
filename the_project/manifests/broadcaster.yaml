apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster-dep
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
      - name: broadcaster
        image: broadcaster
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        env:
          - name: NATS_URL
            value: nats://nats-svc:4222
          # Defaults to the in-cluster sink below; point at a real chat
          # webhook to forward outside the cluster.
          - name: WEBHOOK_URL
            value: http://webhook-sink-svc/
